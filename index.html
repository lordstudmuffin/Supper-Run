<style>
/* Layout: one narrow column of index cards dealt onto a milk-glass kitchen counter. */
:root{
  --counter:#E3EEE7; --card:#FFFDF6; --ink:#2B2340; --soft:#655E7A; --tomato:#CF3F2B; --on-tomato:#FFFDF6;
  --yolk:#F2B632; --on-yolk:#2B2340; --leaf:#2F7D5B; --rule:#BCD6EA; --line:#CBD8CF; --shade:rgba(43,35,64,.14);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif; --hand:"Caveat","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --counter:#1C192A; --card:#2A2640; --ink:#F3EEE2; --soft:#B3ABC8; --tomato:#FF8168; --on-tomato:#2A1210;
  --yolk:#F5C451; --on-yolk:#2B2340; --leaf:#7FD1A8; --rule:#45426A; --line:#3D3958; --shade:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --counter:#1C192A; --card:#2A2640; --ink:#F3EEE2; --soft:#B3ABC8; --tomato:#FF8168; --on-tomato:#2A1210;
  --yolk:#F5C451; --on-yolk:#2B2340; --leaf:#7FD1A8; --rule:#45426A; --line:#3D3958; --shade:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--counter);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.soft{color:var(--soft)} .small{font-size:.86rem} .hand{font-family:var(--hand);font-size:1.45rem;line-height:1.15}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:10px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .row>.grow{flex:1;min-width:0}
.sheet{background:var(--card);border-radius:6px;padding:16px;box-shadow:0 2px 0 var(--line),0 8px 18px -10px var(--shade);display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet.ruled{border-top:3px solid var(--tomato);background-image:repeating-linear-gradient(var(--card) 0 27px,var(--rule) 27px 28px);background-position:0 44px}
.plain{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:11px 18px;font-weight:800;font-family:var(--display);font-size:1.02rem;cursor:pointer;min-height:48px;text-align:center}
.btn.primary{background:var(--tomato);color:var(--on-tomato);border-color:var(--tomato);box-shadow:0 3px 0 var(--shade)}
.btn.yolk{background:var(--yolk);color:var(--on-yolk);border-color:var(--yolk)}
.btn.ghost{border-color:var(--line);font-size:.92rem;min-height:40px;padding:7px 14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 2px;text-decoration:underline;color:var(--soft);cursor:pointer;font-weight:600}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.top h2{flex:1;min-width:0}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--yolk);border-radius:99px;transition:width .6s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{appearance:none;border:0;background:var(--card);border-radius:6px;padding:12px;text-align:left;cursor:pointer;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:1.02rem} .tile span{font-size:.82rem;color:var(--soft)}
.deal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 2px}
.deal.five{grid-template-columns:repeat(3,1fr)}
.ing{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;box-shadow:3px 4px 0 var(--shade);animation:deal .45s both}
.ing:nth-child(3n+1){transform:rotate(-2.5deg)} .ing:nth-child(3n+2){transform:rotate(1.2deg);animation-delay:.12s} .ing:nth-child(3n){transform:rotate(-1deg);animation-delay:.24s}
.ing .e{font-size:2rem;line-height:1} .ing b{font-family:var(--display);font-size:.95rem;line-height:1.1;overflow-wrap:anywhere}
.ing .tag{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--line)}
.ing.rare{border-color:var(--yolk)} .ing.rare .tag{background:var(--yolk);color:var(--on-yolk)}
.ing.mystery{border-style:dashed}
.ing .have{font-size:.74rem;border:1px solid var(--line);background:none;border-radius:99px;padding:3px 8px;cursor:pointer;min-height:30px}
.ing .have[aria-pressed="true"]{background:var(--leaf);color:var(--card);border-color:var(--leaf)}
@keyframes deal{from{opacity:0;translate:0 -18px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion:reduce){.ing{animation:none}.bar>i{transition:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--counter);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.88rem;font-weight:600;min-width:0;overflow-wrap:anywhere}
.chip.no{text-decoration:line-through;color:var(--soft)} .chip button{border:0;background:none;cursor:pointer;padding:0 2px;font-weight:800;min-height:28px}
.chip.pickc{cursor:pointer;min-height:36px;font:inherit;font-size:.88rem;font-weight:600;color:var(--ink)}
.chip.pickc.on{background:var(--leaf);border-color:var(--leaf);color:var(--card)}
.chip.pickc.tab{border-radius:6px;background:var(--card)} .chip.pickc.tab.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip.pickc:disabled{cursor:not-allowed}
details summary{cursor:pointer}
.mod{border-left:5px solid var(--yolk);padding:2px 0 2px 10px}
.safe{border:2px solid var(--leaf);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.safe h3{color:var(--leaf)}
.temps{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.temps li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:6px 0;border-top:1px dashed var(--line);font-size:.9rem}
.temps li.hot{font-weight:800;background:color-mix(in srgb,var(--yolk) 28%,transparent);padding-inline:8px;border-radius:4px}
.temps li span:last-child{font-variant-numeric:tabular-nums;text-align:right;flex:0 0 46%;font-weight:600}
.temps li.hot span:last-child{font-weight:800}
.safe ul.basics{margin:0;padding-left:18px;font-size:.86rem;color:var(--soft)}
.timer{font-family:var(--display);font-weight:800;font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:1.7rem;line-height:1;padding:3px;cursor:pointer;color:var(--line);min-width:36px;min-height:40px}
.stars button.on{color:var(--yolk)}
.rate{display:grid;grid-template-columns:4.6rem 1fr;align-items:center;gap:2px 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:84px;resize:vertical}
input.dish{font-family:var(--hand);font-size:1.5rem;padding:6px 10px}
label.ck{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:.92rem;min-height:42px;min-width:0}
.cks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tomb{background:var(--card);border-radius:90px 90px 6px 6px;padding:26px 18px 16px;text-align:center;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:6px;border:2px solid var(--line)}
.entry{cursor:pointer}
.status{font-size:.82rem;color:var(--soft);text-align:center}
.banner{background:var(--yolk);color:var(--on-yolk);border-radius:6px;padding:10px 12px;font-weight:600;font-size:.9rem}
.note{border:1px dashed var(--soft);border-radius:6px;padding:10px 12px;font-size:.88rem;color:var(--soft)}
.big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--counter);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);z-index:20;text-align:center}
.ladder li{padding:8px 0;border-top:1px dashed var(--line);display:flex;gap:10px} .ladder{list-style:none;margin:0;padding:0}
.ladder .lv{font-family:var(--display);font-weight:800;flex:0 0 3.2rem} .ladder li.locked{color:var(--soft)}
</style>

        <label class="small" for="joincode">Or paste the code from the other phone</label><input type="text" id="joincode" placeholder="sr-xxxx-xxxx-xxxx-xxxx" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button class="btn wide" data-act="linkjoin">Join that kitchen</button></div>`) : ''}
  <div class="sheet"><h3>Move a kitchen by hand</h3><p class="small soft">Copy this code and paste it on another phone to load the same kitchen there. It is a snapshot, so it does not stay in sync afterwards.</p>
    <textarea id="code" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
    <button class="btn wide" data-act="copy">Copy kitchen code</button>
    <label class="small" for="incode">Paste a code to load it here</label><textarea id="incode" placeholder="Paste a kitchen code"></textarea>
    <button class="btn wide" data-act="import">${open === 'import' ? 'Yes, replace this phone\'s kitchen' : 'Load pasted kitchen'}</button></div>`;

function render() {
  if (!V[view]) view = 'home';
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  $('#app').innerHTML = V[view]();
  if (id) { const el = document.getElementById(id); if (el && /INPUT|TEXTAREA/.test(el.tagName)) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } } }
}
function go(v) { view = v; open = null; rescueCat = null; if (v !== 'prefs') draft = null; render(); window.scrollTo(0, 0); }

// ---------- actions ----------
const A = {
  draw(d) {
    const c = draw(d.mode, d.boss);
    if (!c) return toast(S.prefs.ok ? 'Not enough cards to deal with the current avoid list and pantry.' : 'Set up allergies first.');
    if (mutate(s => { s.cur = c; }, true)) go('draw');
  },
  redraw() { const o = S.cur; if (!o || !o.redraws) return; const c = draw(o.mode, o.boss); if (c) { c.redraws = 0; mutate(s => { s.cur = c; }); } },
  abandon() { if (mutate(s => { s.cur = null; }, true)) go('home'); },
  have(d) { mutate(s => { const x = s.cur.cards[+d.i]; x.have = !x.have; }); },
  start() { if (mutate(s => { s.cur.stage = 'cook'; s.cur.started = Date.now(); s.cur.ings = s.cur.cards.map(x => x.n).join(', '); }, true)) go('cook'); },
  timer() { const tm = timerMod(S.cur); mutate(s => { s.cur.timer = Date.now() + tm.min * 60000; }); },
  rescueopen() { if (follower) return toast('Rescues are picked on the main phone.'); rescueCat = 'pick'; render(); },
  rescueclose() { rescueCat = null; render(); },
  rescue(d) {
    const hints = RESCUE[d.cat][1].filter(h => h[1].every(allowed)); // drop any hint that names an avoided food
    const h = pick(hints); rescueCat = null;
    mutate(s => { s.cur.rescue = { cat: d.cat, hint: h[0] }; });
  },
  tojudge() { if (mutate(s => { s.cur.stage = 'judge'; if (!s.cur.epiT) s.cur.epiT = epitaph(s.cur); }, true)) go('judge'); },
  rate(d) { mutate(s => { s.cur.r[+d.c][+d.k] = +d.v; s.cur.force = null; s.cur.rt = s.cur.rt || [0, 0]; s.cur.rt[+d.c] = Date.now(); }); },
  epi() { mutate(s => { s.cur.epiT = epitaph(s.cur); s.cur.epi = ''; }); },
  force(d) { mutate(s => { s.cur.force = d.v === '1'; }); },
  finish() {
    const c = S.cur; if (!c || !rated(c)) return;
    const win = verdict(c), before = levelInfo().L, xp = scoreXp(c, win), name = c.dish.trim() || (win ? 'The Untitled Triumph' : 'The Nameless Dish');
    const entry = { id: c.id, date: new Date().toISOString(), theme: c.theme, cards: c.cards, mods: c.mods, boss: c.boss, head: c.head, headName: chef(c.head), name, r: c.r, avg: avgOf(c.r), win, ings: c.ings, steps: c.steps, epi: win ? '' : (c.epi || (c.epiT || epitaph(c)).replace('{d}', name)), rescue: c.rescue ? c.rescue.cat : null, xp };
    if (!mutate(s => { s.log.push(entry); s.cur = null; }, true)) return;
    const after = levelInfo().L, unlocks = []; for (let l = before + 1; l <= after; l++) unlocks.push(...unlocksAt(l));
    lastResult = { name, xp, win, up: after > before, unlocks: unlocks.filter(u => u[0] !== 'Rare card' || allowed(Object.values(ING).find(g => g.n === u[1]))) };
    go('result');
  },
  tick(d, el) { const set = draft[d.set], i = set.indexOf(d.k); if (el.checked && i < 0) set.push(d.k); if (!el.checked && i >= 0) set.splice(i, 1); render(); },
  saveprefs() {
    const no = draft.no.split(',').map(s => s.trim()).filter(Boolean), dr = draft;
    const ok = mutate(s => {
      s.chefs = [dr.chefs[0].trim() || 'Chef one', dr.chefs[1].trim() || 'Chef two'];
      s.prefs = { ok: true, al: dr.al.slice(), diets: dr.diets.slice(), no };
      if (s.cur && s.cur.cards.some(c => blocked(resolve(c), s.prefs))) { s.cur = null; toast('The challenge on the table used something you now avoid, so it was put back.'); }
    }, true);
    if (ok) go('home');
  },
  padd() {
    const el = $('#pantryadd'), n = el.value.trim(); if (!n) return;
    if (S.pantry.some(p => stems(p.n).join(' ') === stems(n).join(' '))) return toast('That is already on the shelf.');
    const g = lookup(n); if (blocked(g || custom(n))) toast('Added, but it is on your avoid list so it will never be dealt.');
    mutate(s => { s.pantry.push({ n: g ? g.n : n, id: g ? g.id : null }); }); $('#pantryadd').focus();
  },
  pdel(d) { mutate(s => { s.pantry.splice(+d.i, 1); }); },
  pgroup(d) { pgroup = +d.i; render(); },
  ptoggle(d) { const g = ING[d.id]; if (!g || blocked(g)) return; mutate(s => { const i = s.pantry.findIndex(p => p.id === g.id); if (i >= 0) s.pantry.splice(i, 1); else s.pantry.push({ n: g.n, id: g.id }); }); },
  flip() { mutate(s => { s.flip = s.flip ? 0 : 1; }); },
  noterm(d) { const list = draft.no.split(',').map(x => x.trim()).filter(Boolean), i = list.findIndex(x => termKey(x) === termKey(d.t)); if (i >= 0) list.splice(i, 1); else list.push(d.t); draft.no = list.join(', '); render(); },
  open(d) { open = d.id || null; render(); },
  linknew() { setCode(newCode()); if (!S.at) S.at = Date.now(); schedulePush(); render(); toast('Shared kitchen started. Send the link code to the other phone.'); },
  linkjoin() {
    const c = $('#joincode').value.trim().toLowerCase().replace(/\s+/g, ''); if (!CODE_RE.test(c)) return toast('That does not look like a link code. It starts with sr- and has four groups of four.');
    setCode(c); render(); pull(true).then(() => { toast(cloud === 'shared' ? 'Linked. This phone now shares that kitchen.' : 'Saved the code, but could not reach the shared kitchen yet.'); render(); });
  },
  unlink() { if (open !== 'unlink') { open = 'unlink'; return render(); } setCode(null); open = null; render(); },
  copylink() { const t = $('#linkcode'); try { navigator.clipboard.writeText(t.value).then(() => toast('Link code copied.'), () => { t.select(); toast('Select and copy the code above.'); }); } catch (e) { t.select(); toast('Select and copy the code above.'); } },
  copy() { const t = $('#code'); const done = () => toast('Kitchen code copied.'); try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); toast('Select and copy the code above.'); }); } catch (e) { t.select(); toast('Select and copy the code above.'); } },
  import() {
    let j = null; try { j = JSON.parse(decodeURIComponent(escape(atob($('#incode').value.trim())))); } catch (e) { }
    if (!j || j.v !== 1 || !Array.isArray(j.log)) return toast('That does not look like a kitchen code.');
    if (open !== 'import') { const keep = $('#incode').value; open = 'import'; render(); $('#incode').value = keep; return; }
    if (mutate(s => { Object.assign(s, fresh(), j); }, true)) { toast('Kitchen loaded.'); go('home'); }
  }
};
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const b = e.target.closest('[data-act]'); if (b && b.type !== 'checkbox' && A[b.dataset.act]) A[b.dataset.act](b.dataset, b);
});
document.addEventListener('change', e => { const b = e.target; if (b.type === 'checkbox' && b.dataset.act) A[b.dataset.act](b.dataset, b); });
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.d) { if (d.d === 'no') { draft.no = el.value; const p = { al: draft.al, diets: draft.diets, no: el.value.split(',').map(s => s.trim()).filter(Boolean) }; $('#lockout').innerHTML = lockoutText(Object.values(ING).filter(g => !g.st && blocked(g, p))); } else draft.chefs[+d.d.slice(4)] = el.value; }
  else if (d.b && S.cur) { if (!mutate(s => { s.cur[d.b] = el.value; }, true)) return; const p = $('#epi'); if (p) p.textContent = epiText(S.cur); }
  else if (d.e) mutate(s => { const r = s.log.find(x => x.id === d.id); if (r) r[d.e] = el.value; }, true);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pantryadd') A.padd(); });
let swapCalled = null, timeCalled = null;
setInterval(() => {
  const c = S.cur, el = $('#clock'); if (!c || c.stage !== 'cook') return;
  if (el) el.textContent = clockText(c);
  const tm = timerMod(c); if (!tm || !c.timer) return;
  const left = c.timer - Date.now();
  if (c.mods.includes('swap') && left <= tm.min * 30000 && swapCalled !== c.id) { swapCalled = c.id; toast('Halfway! Swap roles now.'); const m = $('#swapmsg'); if (m) m.innerHTML = '<b>Halfway. Swap roles now.</b>'; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { } }
  if (left <= 0 && timeCalled !== c.id) { timeCalled = c.id; toast('Time is up. Hands off the food!'); try { navigator.vibrate && navigator.vibrate(600); } catch (e) { } }
}, 1000);

loadLocal(); render(); connect();
window.__sr = { get S() { return S; }, get cloud() { return cloud; }, get code() { return code; }, blocked, resolve, allowed, draw, deck, ING, RESCUE, levelInfo, custom, stems };
</script>
